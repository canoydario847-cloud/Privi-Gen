name: Privi paid-access protection tests

on:
  push:
    paths:
      - 'protection/**'
      - 'tests/test_licensed_view.py'
      - 'tests/test_stripe_entitlements.py'
      - 'tests/test_entitlement_store.py'
      - 'tests/test_asgi_gate.py'
      - 'tests/test_mcp_policy.py'
      - 'tests/test_paid_access_e2e.py'
      - 'tests/test_paid_access_http_e2e.py'
      - 'tests/test_checkout_fulfillment.py'
      - 'tests/test_stripe_api_adapter.py'
      - 'tests/test_staging_app.py'
      - 'tests/test_postgres_entitlement_store.py'
      - 'tests/test_postgres_integration.py'
      - 'tests/test_checkout_bindings_integration.py'
      - 'tests/test_bound_checkout_postgres_e2e.py'
      - '.github/workflows/protection-tests.yml'
  pull_request:
    paths:
      - 'protection/**'
      - 'tests/test_licensed_view.py'
      - 'tests/test_stripe_entitlements.py'
      - 'tests/test_entitlement_store.py'
      - 'tests/test_asgi_gate.py'
      - 'tests/test_mcp_policy.py'
      - 'tests/test_paid_access_e2e.py'
      - 'tests/test_paid_access_http_e2e.py'
      - 'tests/test_checkout_fulfillment.py'
      - 'tests/test_stripe_api_adapter.py'
      - 'tests/test_staging_app.py'
      - 'tests/test_postgres_entitlement_store.py'
      - 'tests/test_postgres_integration.py'
      - 'tests/test_checkout_bindings_integration.py'
      - 'tests/test_bound_checkout_postgres_e2e.py'
      - '.github/workflows/protection-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Licensed-code view authorization and watermark tests
        run: python -m unittest discover -s tests -p 'test_licensed_view.py' -v
      - name: Stripe webhook authorization tests
        run: python -m unittest discover -s tests -p 'test_stripe_entitlements.py' -v
      - name: Checkout entitlement persistence tests
        run: python -m unittest discover -s tests -p 'test_entitlement_store.py' -v
      - name: Premium API access guard tests
        run: python -m unittest discover -s tests -p 'test_asgi_gate.py' -v
      - name: MCP paid method authorization tests
        run: python -m unittest discover -s tests -p 'test_mcp_policy.py' -v
      - name: Synthetic paid-access end-to-end tests
        run: python -m unittest discover -s tests -p 'test_paid_access_e2e.py' -v
      - name: HTTP-level entitlement integration tests
        run: python -m unittest discover -s tests -p 'test_paid_access_http_e2e.py' -v
      - name: Verify server-bound paid checkout fulfillment
        run: python -m unittest discover -s tests -p 'test_checkout_fulfillment.py' -v
      - name: Test authoritative Stripe fetch adapter
        run: python -m unittest discover -s tests -p 'test_stripe_api_adapter.py' -v
      - name: Test fail-closed staging ASGI service
        run: python -m unittest discover -s tests -p 'test_staging_app.py' -v
      - name: PostgreSQL store contract tests (mock connection)
        run: python -m unittest discover -s tests -p 'test_postgres_entitlement_store.py' -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: privi_ci
          POSTGRES_PASSWORD: local_ci_fixture_only
          POSTGRES_DB: privi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privi_ci -d privi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRIVI_TEST_DATABASE_URL: postgresql://privi_ci:local_ci_fixture_only@localhost:5432/privi_ci
      PRIVI_TEST_ALLOW_SCHEMA_RESET: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Test paid access with real PostgreSQL and concurrent webhooks
        run: python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
      - name: Test immutable buyer-to-checkout bindings in PostgreSQL
        run: python -m unittest discover -s tests -p 'test_checkout_bindings_integration.py' -v
      - name: Test signed checkout with PostgreSQL binding and access
        run: python -m unittest discover -s tests -p 'test_bound_checkout_postgres_e2e.py' -v

name: Assemble Privi source workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'privi_gen.py'
      - '.github/workflows/assemble-privi-source.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Privi-Gen
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone registered source projects and record commits
        run: python3 privi_gen.py sync --dest ./privi-workspace
      - name: Create per-project source indexes
        shell: bash
        run: |
          set -euo pipefail
          for repo in ./privi-workspace/Privi*; do
            if [ -d "$repo/.git" ]; then
              python3 privi_gen.py inventory --repo "$repo" --out "./privi-workspace/$(basename "$repo")-source-index.json"
            fi
          done
      # SECURITY: Do not upload a compiled multi-repository source bundle.
      # GitHub Actions artifacts on public repositories may expose copied source
      # to users outside the intended paid-customer delivery channel.
      # Preserve the source inventory for this ephemeral workflow run only;
      # distribution must use a private, access-controlled release pipeline.
      - name: Confirm local source workspace without publishing
        shell: bash
        run: |
          test -d ./privi-workspace
          echo "Source inventory generated locally; publication disabled."

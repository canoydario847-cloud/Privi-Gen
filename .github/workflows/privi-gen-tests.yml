name: Privi-Gen Source Tool Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out generator source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate catalog
        run: python3 privi_gen.py catalog
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
